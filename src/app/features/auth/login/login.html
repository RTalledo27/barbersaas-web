<!-- Header -->
<div class="login-header">
  <h2 class="login-title">Bienvenido de vuelta</h2>
  <p class="login-subtitle">Ingresa a tu panel de control</p>
</div>

<!-- Error alert -->
@if (error()) {
  <div class="alert-error">
    <div class="alert-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <span>{{ error() }}</span>
  </div>
}

<!-- Form -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">

  <!-- Email -->
  <div class="form-field" [class.error]="emailInvalid">
    <div class="input-wrapper">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder=" "
        autocomplete="email"
      />
      <label for="email">Correo electrónico</label>
    </div>
    @if (emailInvalid) {
      <span class="field-error">Ingresa un correo válido</span>
    }
  </div>

  <!-- Password -->
  <div class="form-field" [class.error]="passwordInvalid">
    <div class="input-wrapper">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder=" "
        autocomplete="current-password"
      />
      <label for="password">Contraseña</label>
      <button type="button" class="toggle-password" (click)="togglePassword()">
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" x2="22" y1="2" y2="22"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>
    @if (passwordInvalid) {
      <span class="field-error">Mínimo 6 caracteres</span>
    }
  </div>

  <!-- Remember + forgot -->
  <div class="form-meta">
    <label class="checkbox-wrapper">
      <input type="checkbox" />
      <span class="checkbox-custom"></span>
      <span class="checkbox-label">Recordarme</span>
    </label>
    <a routerLink="/auth/forgot-password" class="forgot-link">
      ¿Olvidaste tu contraseña?
    </a>
  </div>

  <!-- Submit button (subtle, secondary) -->
  <button type="submit" class="submit-button" [disabled]="loading()">
    @if (loading()) {
      <svg class="spinner" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/>
        <path fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      <span>Iniciando sesión...</span>
    } @else {
      <span>Iniciar sesión</span>
      <svg class="button-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    }
  </button>

</form>

<!-- Divider with promo -->
<div class="divider-section">
  <div class="divider-line"></div>
  <span class="divider-text">¿Aún no tienes cuenta?</span>
  <div class="divider-line"></div>
</div>

<!-- Register CTA — PRIMARY GOLD -->
<a routerLink="/auth/register" class="register-cta">
  <span class="register-shimmer"></span>
  <div class="register-content">
    <div class="register-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
      </svg>
    </div>
    <div class="register-text">
      <div class="register-title">Registra tu barbería gratis</div>
      <div class="register-subtitle">Sin tarjeta · 14 días de prueba premium</div>
    </div>
  </div>
  <svg class="register-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </svg>
</a>
